name: hpc-cluster

x-node: &node
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      UBUNTU_VERSION: ${UBUNTU_VERSION:-24.04}
      CLUSTER_UID: ${CLUSTER_UID:-1001}
  image: hpc-node:${IMAGE_TAG:-1.0}
  init: true
  restart: unless-stopped
  networks:
    - hpc-net
  volumes:
    - ./keys:/run/cluster-keys:ro
    - ./workloads:/home/hpcuser/workloads
    - ./scripts:/home/hpcuser/scripts:ro
  healthcheck:
    test: [ "CMD-SHELL", "nc -z localhost 22 || exit 1" ]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  compute1:
    <<: *node
    container_name: hpc-compute1
    hostname: compute1
    environment:
      NODE_ROLE: compute
    cpus: "${COMPUTE_CPUS:-2}"
    mem_limit: 1g
    labels:
      hpc.role: "compute"

  compute2:
    <<: *node
    container_name: hpc-compute2
    hostname: compute2
    environment:
      NODE_ROLE: compute
    cpus: "${COMPUTE_CPUS:-2}"
    mem_limit: 1g
    labels:
      hpc.role: "compute"

  head:
    <<: *node
    container_name: hpc-head
    hostname: head
    environment:
      NODE_ROLE: head
    cpus: "1.0"
    mem_limit: 512m
    labels:
      hpc.role: "head"
    depends_on:
      compute1:
        condition: service_healthy
      compute2:
        condition: service_healthy

  keygen:
    image: hpc-node:${IMAGE_TAG:-1.0}
    profiles: [ "setup" ]
    network_mode: none
    entrypoint: [ "/bin/sh", "-c" ]
    command: [ "[ -f /keys/id_ed25519 ] || ssh-keygen -t ed25519 -N '' -C hpc-cluster -f /keys/id_ed25519" ]
    volumes:
      - ./keys:/keys

networks:
  hpc-net:
    name: hpc-net
    driver: bridge
    ipam:
      config:
        - subnet: ${CLUSTER_SUBNET:-172.30.0.0/24}
